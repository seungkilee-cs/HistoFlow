name: Services CI

on:
  push:
    branches: [master]
    paths:
      - 'services/region-detector/**'
      - '.github/workflows/services-ci.yml'
  pull_request:
    paths:
      - 'services/region-detector/**'
      - '.github/workflows/services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-detector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/region-detector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/region-detector/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest tests -q
