server:
  port: 8080

spring:
  application:
    name: histoflow-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/histoflow
    driver-class-name: org.postgresql.Driver
    username: histoflow
    password: histoflow123

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# MinIO Configuration (S3-compatible object storage)
minio:
  endpoint: http://minio:9000          # internal (Docker network)
  public-endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    tiles: histoflow-tiles
    uploads: unprocessed-slides
    
tiling:
  base-url: http://localhost:8000

analysis:
  base-url: http://localhost:8001

# Authentication: self-issued HS256 JWT. Override the secret and dev
# credentials via environment variables in any shared/prod environment.
security:
  jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
  dev-username: ${AUTH_USERNAME:histoflow}
  dev-password: ${AUTH_PASSWORD:histoflow}
  default-tenant: ${DEFAULT_TENANT:default}

# Logging Configuration
logging:
  level:
    root: INFO
    com.histoflow.backend: DEBUG
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
