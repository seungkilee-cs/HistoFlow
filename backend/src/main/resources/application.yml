server:
  port: 8080

spring:
  application:
    name: histoflow-backend
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/histoflow}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:histoflow}
    # Secret: supplied via environment (see .env.example). No committed default —
    # the app fails fast on startup if it is unset.
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# MinIO Configuration (S3-compatible object storage)
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}          # internal (Docker network)
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  # Secret: supplied via environment (see .env.example). No committed default.
  secret-key: ${MINIO_ROOT_PASSWORD}
  buckets:
    tiles: histoflow-tiles
    uploads: unprocessed-slides
    
tiling:
  base-url: http://localhost:8000

analysis:
  base-url: http://localhost:8001

# Logging Configuration
logging:
  level:
    root: INFO
    com.histoflow.backend: DEBUG
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
